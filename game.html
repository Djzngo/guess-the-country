<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="guess-country-game, europe, random-country, guess, game">
    <title>GTC | Homepage</title>

    <!-- Favicon -->
    <link rel="shortcut icon" type="image/x-icon" sizes="64x64" href="assets/images/favicon.ico">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- navigation bar -->
    <nav id="navbar" class="navbar navbar-expand-lg">
        <div class="container">
          <a class="navbar-brand" href="index.html" aria-label="Homepage shortcut">
            <img src="assets/images/GTC-logo-two.png" alt="GTC logo" class="logo">
          </a>
          <h1 class="navTitle">Guess The Country</h1>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="fa-solid fa-gamepad fa-lg"></span>
            </button>
            <div class="collapse navbar-collapse text-end" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="game.html">Game</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <header id="header">
      <div class="container">
        <div class="row text-center mt-4">
          <div class="col-12">
            <h1>Guess The Country</h1>
          </div>
        </div>
      </div>
      <div class="container text-center">
        <div id="loading" class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </header>
    <!-- Game elements -->
    <main style="display: none;">
      <!-- Indicators section -->
      <section id="indicators">
        <div class="container indicators">
          <div class="row text-center mt-5">
            <div class="col-6 col-lg-3">
              <h4>Region</h4>
              <p id="txtRegion">-</p>
              <button id="btnRegion" type="button" class="btn btn-primary">Reveal</button>
            </div>
            <div class="col-6 col-lg-3">
              <h4>Currency</h4>
              <p id="txtCurrency">-</p>
              <button id="btnCurrency" type="button" class="btn btn-primary">Reveal</button>
            </div>
            <div class="col-6 col-lg-3">
              <h4>Longitude</h4>
              <p id="txtLongitude">-</p>
            </div>
            <div class="col-6 col-lg-3">
              <h4>Latitude</h4>
              <p id="txtLatitude">-</p>
            </div>
          </div>
        </div>
      </section>
      <!-- Feedback section -->
      <section id="feedback">
        <div class="container text-center">
          <div class="row mt-4">
            <div class="col-12">
              <button id="btnStart" type="button" class="world">Start Game</button>
            </div>
          </div>
          <div class="row mt-4">
            <div id="reaction">

            </div>
          </div>
        </div>
      </section>
      <!-- User input section -->
      <section id="userInput">
        <div class="container">
          <div class="row mt-4 text-start">
            <div class="col-6">
              <label for="txtGuess">Guess</label>
            </div>
            <div class="col-6 text-end">
              <div id="loadingStart" class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-12">
              <input type="text" id="txtGuess" name="txtGuess" placeholder="Input here..." disabled>
            </div>
          </div>
          <div class="row mt-4">
            <div class="col-4">
              <button id="btnSubmit" type="button" class="btn btn-primary" disabled>Submit</button>
            </div>
            <div class="col-4">
              <button id="btnRestart" type="button" class="btn btn-primary" disabled>Restart</button>
            </div>
            <div class="col-4 text-center">
              <p id="guessCount">Guesses: -</p>
            </div>
          </div>
      </section>
    </main>
    <!-- Footer -->
    <!-- mt-auto added to push footer to the bottom of the page-->
    <footer id="about" class="mt-auto">
      <div class="conatiner text-center footer">
        <div class="row align-items-center">
          <div class="col-md-12 col-lg-3 text-sm-center text-md-center text-lg-start">
            <p>NMZBOF &copy;</p>
          </div>
          <div class="col-4 col-md-4 col-lg-3 socials">
              <a href="https://www.facebook.com" target="_blank" rel="noopener" aria-label="Facebook Social Media Page (Opens in new tab)">
                <i class="fa-brands fa-facebook"></i>
                <p>Facebook</p>
              </a>
          </div>
          <div class="col-4 col-md-4 col-lg-3 socials">
            <a href="https://www.x.com" target="_blank" rel="noopener" aria-label="Facebook Social Media Page (Opens in new tab)">
              <i class="fa-brands fa-x-twitter"></i>
              <p>X</p>
            </a>
          </div>
          <div class="col-4 col-md-4 col-lg-3 socials">
            <a href="https://www.instagram.com" target="_blank" rel="noopener" aria-label="Facebook Social Media Page (Opens in new tab)">
              <i class="fa-brands fa-instagram"></i>
              <p>Instagram</p>
            </a>
          </div>
        </div>
      </div>
    </footer>
    <!-- Scripts -->
    <script src="jquery-4.0.0.js"></script>
    <script src="/assets/scripts/script.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- Fontawesome kit -->
    <script src="https://kit.fontawesome.com/68e4433a11.js" crossorigin="anonymous"></script>
    <!-- Page loading animations -->
    <script>
      $(function() {
        $("#loading").fadeOut(750);
        $("main").slideDown(1500);
      });
    </script>
</body>
</html>
